<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Sapphire to Midnight Navy -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F5A" />
      <stop offset="45%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#051324" />
    </linearGradient>

    <!-- Gold Border Gradient (Luxury metallic shine) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE082" />
      <stop offset="30%" stop-color="#D4A843" />
      <stop offset="70%" stop-color="#B88628" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Royal/Cobalt Blue Gradient for Globe (Bright & High Contrast) -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Drop Shadows for 3D depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGradient)" />

  <!-- Gold Border matching the AMA badge style -->
  <rect x="22" y="22" width="468" height="468" rx="90" ry="90" fill="none" stroke="url(#goldGradient)" stroke-width="20" />

  <!-- Inner subtle glow frame -->
  <rect x="38" y="38" width="436" height="436" rx="76" ry="76" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Emblem Group -->
  <g filter="url(#glow)">
    <!-- Globe Base Sphere with Gradient -->
    <circle cx="256" cy="195" r="92" fill="none" stroke="url(#blueGradient)" stroke-width="12" />

    <!-- Globe Longitude Ellipse 1 (Inner) -->
    <ellipse cx="256" cy="195" rx="42" ry="92" fill="none" stroke="url(#blueGradient)" stroke-width="10" />

    <!-- Globe Longitude Line (Center Vertical) -->
    <line x1="256" y1="103" x2="256" y2="287" stroke="url(#blueGradient)" stroke-width="10" />

    <!-- Globe Latitude Line (Equator) -->
    <line x1="164" y1="195" x2="348" y2="195" stroke="url(#blueGradient)" stroke-width="9" />

    <!-- Globe Latitude Arc (Tropic of Cancer) -->
    <path d="M 180 152 Q 256 178 332 152" fill="none" stroke="url(#blueGradient)" stroke-width="7" />

    <!-- Globe Latitude Arc (Tropic of Capricorn) -->
    <path d="M 180 238 Q 256 212 332 238" fill="none" stroke="url(#blueGradient)" stroke-width="7" />

    <!-- Radiant Golden Swoosh wrapping the globe dynamically -->
    <path d="M 115 242 C 160 318, 350 318, 395 210 C 375 268, 225 302, 140 248 Z" 
          fill="url(#goldGradient)" />

    <!-- Upper Gold Accent Swoosh Curve -->
    <path d="M 135 225 C 190 165, 320 160, 380 215 C 340 180, 205 180, 152 220 Z" 
          fill="url(#goldGradient)" opacity="0.9" />

    <!-- Big Bold "UCS" Text Emblem in Gold -->
    <text x="256" y="405" 
          font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#goldGradient)">
      UCS
    </text>
  </g>
</svg>